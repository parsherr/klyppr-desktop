<!DOCTYPE html>
<html>
<head>
    <title>Klyppr - Automatic Video Silence Clipper</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Klyppr</h1>
        <div class="form-group">
            <label>Input Video:</label>
            <div class="input-group">
                <input type="text" id="inputPath" readonly placeholder="Select video file...">
                <button class="browse-btn" onclick="selectInput()">Browse</button>
            </div>
        </div>

        <div class="form-group">
            <label>Output Folder:</label>
            <div class="input-group">
                <input type="text" id="outputPath" readonly placeholder="Select output folder...">
                <button class="browse-btn" onclick="selectOutput()">Browse</button>
            </div>
        </div>

        <div class="button-group">
            <button class="preset-btn active" data-preset="recommended">Recommended</button>
            <button class="preset-btn" data-preset="fast">Extra Fast</button>
        </div>

        <div id="customSettings" class="settings-group visible">
            <div class="form-group">
                <label>Silence Threshold (dB):</label>
                <input type="number" id="silenceDb" value="-45" step="1">
            </div>

            <div class="form-group">
                <label>Minimum Silence Duration (seconds):</label>
                <input type="number" id="minSilenceDuration" value="0.6" step="0.1" min="0">
            </div>

            <div class="form-group">
                <label>Padding Duration (seconds):</label>
                <input type="number" id="paddingDuration" value="0.05" step="0.01" min="0">
            </div>
        </div>

        <div class="settings-group">
            <h2>Audio Improvements</h2>
            <div class="form-group">
                <label><input type="checkbox" id="removeNoise"> Remove Background Noise</label>
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="normalizeAudio"> Normalize Audio (-13 LUFS)</label>
            </div>
        </div>

        <div class="settings-group">
            <h2>Background Music</h2>
            <div class="form-group">
                <label><input type="checkbox" id="addMusic"> Add Background Music</label>
            </div>
            <div class="form-group">
                <label>Music Library:</label>
                <select id="musicLibrary"></select>
                <button onclick="addMusicFile()">Add New Music</button>
            </div>
            <div class="form-group">
                <label>Music Volume (dB):</label>
                <input type="range" id="musicVolume" min="-30" max="0" value="-20">
                <span id="musicVolumeLabel">-20 dB</span>
            </div>
        </div>

        <div class="settings-group">
            <h2>Subtitles</h2>
            <div class="form-group">
                <label><input type="checkbox" id="generateSubtitles"> Generate & Add Subtitles</label>
            </div>
            <div class="form-group">
                <label for="apiKey">API Key:</label>
                <input type="text" id="apiKey" placeholder="Enter your SpeechFlow API key...">
            </div>
        </div>

        <button id="startBtn" onclick="startProcessing()" disabled>Start Processing</button>

        <div id="progress">
            <div>Processing status: <span id="status">Preparing...</span></div>
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div id="log"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        // Preset değerleri
        const presets = {
            recommended: {
                silenceDb: -45,
                minSilenceDuration: 0.6,
                paddingDuration: 0.05
            },
            fast: {
                silenceDb: -30,
                minSilenceDuration: 0.3,
                paddingDuration: 0.02
            }
        };

        // Load music library on startup
        document.addEventListener('DOMContentLoaded', () => {
            ipcRenderer.send('get-music-library');
        });

        ipcRenderer.on('music-library-loaded', (event, musicFiles) => {
            const musicLibrary = document.getElementById('musicLibrary');
            musicLibrary.innerHTML = '';
            musicFiles.forEach(file => {
                const option = document.createElement('option');
                option.value = file;
                option.textContent = file;
                musicLibrary.appendChild(option);
            });

            // --- Dynamic UI Controls ---
            const addMusicCheckbox = document.getElementById('addMusic');
            const musicVolume = document.getElementById('musicVolume');
            const addMusicButton = document.querySelector('button[onclick="addMusicFile()"]');

            function toggleMusicControls() {
                console.log('Checkbox checked:', addMusicCheckbox.checked);
                const disabled = !addMusicCheckbox.checked;
                musicLibrary.disabled = disabled;
                musicVolume.disabled = disabled;
                addMusicButton.disabled = disabled;
            }

            addMusicCheckbox.addEventListener('change', toggleMusicControls);
            toggleMusicControls(); // Initial state

            const generateSubtitlesCheckbox = document.getElementById('generateSubtitles');
            const apiKeyInput = document.getElementById('apiKey');

            function toggleSubtitleControls() {
                apiKeyInput.disabled = !generateSubtitlesCheckbox.checked;
            }

            generateSubtitlesCheckbox.addEventListener('change', toggleSubtitleControls);
            toggleSubtitleControls(); // Initial state
        });

        // Add new music file
        function addMusicFile() {
            ipcRenderer.send('select-music-file');
        }

        // Update music volume label
        document.getElementById('musicVolume').addEventListener('input', (event) => {
            document.getElementById('musicVolumeLabel').textContent = `${event.target.value} dB`;
        });

        // Preset butonları için olay dinleyicileri
        document.querySelectorAll('.preset-btn').forEach(button => {
            button.addEventListener('click', () => {
                // Aktif butonu değiştir
                document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const preset = button.dataset.preset;
                const values = presets[preset];
                document.getElementById('silenceDb').value = values.silenceDb;
                document.getElementById('minSilenceDuration').value = values.minSilenceDuration;
                document.getElementById('paddingDuration').value = values.paddingDuration;
            });
        });

        function selectInput() {
            ipcRenderer.send('select-input');
        }

        function selectOutput() {
            ipcRenderer.send('select-output');
        }

        function startProcessing() {
            const params = {
                inputPath: document.getElementById('inputPath').value,
                outputPath: document.getElementById('outputPath').value,
                // Silence params
                silenceDb: document.getElementById('silenceDb').value,
                minSilenceDuration: document.getElementById('minSilenceDuration').value,
                paddingDuration: document.getElementById('paddingDuration').value,
                // Audio params
                removeNoise: document.getElementById('removeNoise').checked,
                normalizeAudio: document.getElementById('normalizeAudio').checked,
                // Music params
                addMusic: document.getElementById('addMusic').checked,
                musicPath: document.getElementById('musicLibrary').value,
                musicVolume: document.getElementById('musicVolume').value,
                // Subtitle params
                generateSubtitles: document.getElementById('generateSubtitles').checked,
                apiKey: document.getElementById('apiKey').value,
            };

            document.getElementById('startBtn').disabled = true;
            document.getElementById('progress').style.display = 'block';
            document.getElementById('log').style.display = 'block';
            document.getElementById('status').textContent = 'Starting process...';

            // Progress bar'ı sıfırla
            document.getElementById('progressBar').style.width = '0%';

            ipcRenderer.send('start-processing', params);
        }

        ipcRenderer.on('input-selected', (event, path) => {
            document.getElementById('inputPath').value = path;
            updateStartButton();
        });

        ipcRenderer.on('output-selected', (event, path) => {
            document.getElementById('outputPath').value = path;
            updateStartButton();
        });

        ipcRenderer.on('progress', (event, data) => {
            const status = document.getElementById('status');
            const progressBar = document.getElementById('progressBar');

            status.textContent = data.status;

            // Only update the progress bar if a percentage is provided
            if (data.percent) {
                progressBar.style.width = `${data.percent}%`;
            }
        });

        ipcRenderer.on('log', (event, message) => {
            const log = document.getElementById('log');
            log.innerHTML += message + '<br>';
            log.scrollTop = log.scrollHeight;
        });

        ipcRenderer.on('completed', (event, success) => {
            document.getElementById('startBtn').disabled = false;
            document.getElementById('status').textContent = success ? 'Process completed!' : 'Error occurred!';
            if (success) {
                // İşlem tamamlandığında progress bar'ı %100'e tamamla
                document.getElementById('progressBar').style.width = '100%';
                // 1 saniye sonra progress'i gizle
                setTimeout(() => {
                    document.getElementById('progress').style.display = 'none';
                    document.getElementById('progressBar').style.width = '0%';
                }, 1000);
            }
        });

        function updateStartButton() {
            const inputPath = document.getElementById('inputPath').value;
            const outputPath = document.getElementById('outputPath').value;
            document.getElementById('startBtn').disabled = !(inputPath && outputPath);
        }
    </script>
</body>
</html>
